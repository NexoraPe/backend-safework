# Spring DataSource Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:safework}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:safework_app}
spring.datasource.password=${DB_USERNAME_PASSWORD:safework_app}

# Spring Data JPA Configuration
spring.jpa.show-sql=true